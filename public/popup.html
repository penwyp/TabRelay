<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TabRelay · 搜索工作区</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="search.css" />
  </head>
  <body class="search-body workbench-page popup-workbench">
    <header class="search-topbar">
      <div class="brand">
        <img
          class="brand-icon"
          src="icons/icon-48.png"
          width="32"
          height="32"
          alt=""
        /><span>TabRelay</span>
      </div>
      <div class="workbench-header-actions">
        <button id="workbench-sync" class="text-button">立即同步</button
        ><button
          id="workbench-settings"
          class="icon-button"
          aria-label="打开设置"
          title="独立设置页"
        >
          ⚙
        </button>
      </div>
    </header>
    <main class="search-layout">
      <section id="sync-home" class="sync-home" aria-live="polite">
        <div class="sync-home-label">最近同步</div>
        <h1 id="sync-outcome">正在读取状态</h1>
        <p id="sync-attempt-time"></p>
        <p id="sync-home-error" class="inline-error" hidden></p>
        <div class="sync-home-meta">
          <span id="sync-last-success"></span><span id="sync-home-next"></span>
        </div>
      </section>
      <section class="search-hero">
        <form id="search-form" class="search-box" role="search">
          <span aria-hidden="true">⌕</span
          ><input
            id="search-query"
            type="search"
            maxlength="512"
            autocomplete="off"
            placeholder="搜索网址或正文"
            aria-label="搜索网址或正文"
          /><button type="submit" class="primary" id="search-submit">
            搜索
          </button>
        </form>
      </section>
      <section class="search-scope" aria-label="搜索覆盖范围">
        <div class="scope-top">
          <div>
            <h2>
              覆盖 <span id="coverage-badge" class="scope-badge">未加载</span>
            </h2>
            <p id="coverage-summary">正在读取索引…</p>
          </div>
          <div class="scope-actions">
            <button id="load-snapshots" class="secondary">刷新</button
            ><button id="rebuild-cache" class="primary" hidden>
              重建搜索缓存</button
            ><button id="cancel-load" class="secondary" hidden>暂停</button>
          </div>
        </div>
        <div id="loading-progress" class="progress-track" hidden>
          <div id="loading-progress-fill" class="progress-fill"></div>
        </div>
        <div id="coverage-warning" class="scope-warning" hidden></div>
        <details id="source-details">
          <summary>范围、时间与正文详情</summary>
          <div class="coverage-foot">
            <span id="coverage-observed"></span
            ><span id="coverage-updated"></span>
          </div>
          <p id="body-coverage" class="body-coverage"></p>
          <div class="workbench-local">
            <span id="workbench-sync-status">正在读取本机状态…</span
            ><span id="workbench-next-sync"></span>
          </div>
          <div id="source-list" class="source-list"></div>
          <div class="coverage-detail-actions">
            <button id="clear-cache" class="text-button danger">
              清空本机搜索缓存
            </button>
          </div>
        </details>
      </section>
      <section
        id="workbench-operation"
        class="workbench-operation"
        hidden
        aria-live="polite"
      >
        <div class="section-heading">
          <h2 id="workbench-operation-title">恢复进度</h2>
          <span id="workbench-operation-status" class="pill"></span>
        </div>
        <div class="progress-track">
          <div id="workbench-operation-fill" class="progress-fill"></div>
        </div>
        <p id="workbench-operation-detail"></p>
        <p id="workbench-operation-error" class="inline-error" hidden></p>
        <div class="button-row">
          <button id="workbench-cancel-restore" class="secondary" hidden>
            停止后续创建</button
          ><button id="workbench-resume-restore" class="secondary" hidden>
            继续恢复
          </button>
        </div>
      </section>
      <p
        id="workbench-sync-alert"
        class="inline-error popup-sync-alert"
        role="alert"
        hidden
      ></p>
      <p id="body-limit-warning" class="scope-warning" hidden=""></p>
      <div id="search-notice" class="notice" role="status" hidden></div>
      <div class="search-content">
        <div class="workbench-tools">
          <details id="device-workspaces" class="workbench-details">
            <summary>
              设备与窗口 <span id="workbench-device-count"></span>
            </summary>
            <div id="workbench-device-list"></div>
          </details>
          <details class="workbench-filter-details">
            <summary>筛选</summary>
            <aside class="search-filters" aria-label="筛选">
              <div class="filter-heading">
                <h2>筛选</h2>
                <button id="reset-filters" class="text-button">重置</button>
              </div>
              <label class="search-field"
                >设备<select id="filter-device">
                  <option value="">全部已加载设备</option>
                </select></label
              ><label class="search-field"
                >快照类型<select id="filter-kind">
                  <option value="">全部已加载类型</option>
                  <option value="current">当前快照</option>
                  <option value="history">恢复点 / 历史版本</option>
                </select></label
              ><label class="search-field"
                >域名<input
                  id="filter-domain"
                  type="text"
                  placeholder="域名或其子域名，例如 example.com" /></label
              ><label class="search-field"
                >标签组<input
                  id="filter-group"
                  type="text"
                  placeholder="包含的组名" /></label
              ><label class="filter-checkbox"
                ><input id="filter-pinned" type="checkbox" />
                仅显示置顶标签</label
              >
              <div class="filter-divider"></div>
              <div class="date-filter-label">快照观察时间</div>
              <label class="search-field"
                >从<input id="filter-after" type="date" /></label
              ><label class="search-field"
                >到<input id="filter-before" type="date"
              /></label>
              <label class="search-field"
                >最多显示<select id="result-limit">
                  <option value="50">50 条</option>
                  <option value="100" selected>100 条</option>
                  <option value="200">200 条</option>
                </select></label
              >
            </aside>
          </details>
        </div>
        <section class="search-results-section" aria-label="搜索结果">
          <div class="results-heading">
            <h2 id="results-title">搜索结果</h2>
            <span id="result-count"></span>
          </div>
          <p id="result-explanation" class="result-explanation"></p>
          <div id="search-results" class="search-results">
            <div class="search-empty">
              <span aria-hidden="true">⌕</span>
              <h3>还没有可搜索的快照</h3>
            </div>
          </div>
        </section>
      </div>
    </main>
    <dialog id="search-restore-dialog">
      <div class="dialog-heading">
        <div>
          <h2>确认恢复到新窗口</h2>
        </div>
        <button
          id="search-restore-close"
          class="icon-button"
          aria-label="关闭恢复预览"
        >
          ×
        </button>
      </div>
      <p id="search-plan-source" class="muted"></p>
      <p id="search-plan-time" class="field-hint"></p>
      <div id="search-plan-stats" class="plan-stats"></div>
      <p id="search-plan-existing" class="preserve-note"></p>
      <div id="search-plan-skipped" class="skipped-list"></div>
      <div class="dialog-actions">
        <button id="search-restore-back" class="secondary">返回</button
        ><button id="search-confirm-restore" class="primary">
          确认新增窗口
        </button>
      </div>
    </dialog>
    <script src="popup.js" type="module"></script>
  </body>
</html>
