<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TabRelay · 同步设置</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-body">
    <header class="options-topbar">
      <div class="brand">
        <img
          class="brand-icon"
          src="icons/icon-48.png"
          width="36"
          height="36"
          alt=""
        /><span>TabRelay</span>
      </div>
      <span class="settings-page-label">设置</span>
    </header>
    <main class="options-layout" style="display: block; max-width: 720px">
      <section class="options-card" aria-label="同步设置">
        <div class="options-card-heading">
          <h2>同步设置</h2>
        </div>
        <form id="settings-form">
          <fieldset id="settings-fields" disabled>
            <label class="field"
              >设备名称<input
                id="device-name"
                name="deviceName"
                required
                maxlength="80"
                placeholder="例如：我的工作电脑"
            /></label>
            <label class="field"
              >WebDAV 地址<input
                id="endpoint"
                name="endpoint"
                required
                type="url"
                placeholder="https://dav.example.com/remote.php/dav/files/me/"
            /></label>
            <div class="field-grid">
              <label class="field"
                >用户名<input
                  id="username"
                  name="username"
                  autocomplete="username" /></label
              ><label class="field"
                >应用专用密码<input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="WebDAV 应用专用密码"
              /></label>
            </div>
            <label class="toggle-line"
              ><input id="enabled" type="checkbox" />
              自动同步本机所有普通窗口</label
            >
            <label class="field"
              >自动同步频率
              <select
                id="sync-interval"
                class="secondary wide"
                aria-label="自动同步频率"
              >
                <option value="5">每 5 分钟</option>
                <option value="10" selected>每 10 分钟（默认）</option>
                <option value="30">每 30 分钟</option>
                <option value="60">每小时</option>
                <option value="1440">每天</option>
              </select>
            </label>
            <details class="privacy-settings" id="content-settings">
              <summary>正文搜索（默认关闭）</summary>
              <label class="toggle-line"
                ><input
                  id="content-enabled"
                  type="checkbox"
                />启用正文采集</label
              >
              <label class="field"
                >允许采集的站点（每行一个完整源）<textarea
                  id="content-origins"
                  rows="3"
                  placeholder="https://docs.example.com
https://wiki.example.com"
                ></textarea>
              </label>
            </details>
            <details class="privacy-settings">
              <summary>隐私与保留策略</summary>
              <label class="field"
                >不采集的域名<textarea
                  id="blacklist"
                  rows="3"
                  placeholder="bank.example.com
internal.example.com"
                ></textarea>
              </label>
              <label class="field"
                >移除的 URL 查询参数<input
                  id="strip-params"
                  placeholder="token, access_token, code" /></label
              ><label class="field"
                >历史快照保留数<input
                  id="history-limit"
                  type="number"
                  min="1"
                  max="100"
                  value="20" /></label
              ><label class="field"
                >快照加密口令（可选）<input
                  id="encryption-passphrase"
                  type="password"
                  autocomplete="new-password"
                  placeholder="所有设备使用相同口令"
              /></label>
            </details>
          </fieldset>
          <p
            id="settings-error"
            class="settings-feedback"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <div class="options-actions">
            <button
              type="button"
              id="test-connection"
              class="secondary"
              disabled
            >
              测试连接</button
            ><button type="submit" id="save-settings" class="primary" disabled>
              保存设置
            </button>
          </div>
        </form>
      </section>
    </main>
    <script src="options.js" type="module"></script>
  </body>
</html>
